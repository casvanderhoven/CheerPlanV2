# XcodeGen spec — generate with `xcodegen generate --spec App/project.yml --project App`
name: CheerPlan
options:
  bundleIdPrefix: com.cheerplan
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CheerPlanCore:
    path: ../CheerPlanCore
  CheerPlanData:
    path: ../CheerPlanData
  CheerPlanUI:
    path: ../CheerPlanUI
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  CheerPlan:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: CheerPlanCore
      - package: CheerPlanData
      - package: CheerPlanUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cheerplan.app
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.4.0"
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.cheerplan.app
            CFBundleURLSchemes:
              - cheerplan
        CFBundleDocumentTypes:
          - CFBundleTypeName: CheerPlan Plan
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.cheerplan.plan
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cheerplan.plan
            UTTypeDescription: CheerPlan Plan
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - cheerplan
    scheme:
      testTargets: []
