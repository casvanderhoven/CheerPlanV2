name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core-tests:
    name: CheerPlanCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        working-directory: CheerPlanCore
        run: swift test --enable-code-coverage

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.57.0
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swiftlint --strict --reporter github-actions-logging

  app-build:
    name: App build + package tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test CheerPlanUI
        working-directory: CheerPlanUI
        run: swift test
      - name: Test CheerPlanData
        working-directory: CheerPlanData
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec App/project.yml --project App
      - name: Build app for iOS Simulator
        run: >
          xcodebuild build
          -project App/CheerPlan.xcodeproj
          -scheme CheerPlan
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          -quiet
